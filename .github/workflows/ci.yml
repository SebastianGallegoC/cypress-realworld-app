name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:ci

      - name: Run Cypress e2e tests
        run: npm run cypress:run

      # === PASO DE SONARCLOUD ===
      # Reemplazar MI_ORG_EN_SONARCLOUD por tu organización en SonarCloud
      # Reemplazar MI_PROJECT_KEY_EN_SONARCLOUD por tu clave de proyecto en SonarCloud
      # Asegúrate de tener el secreto SONAR_TOKEN configurado en GitHub
      # Este paso se ejecutará solo si el secreto SONAR_TOKEN está configurado
      - name: SonarCloud scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=MI_ORG_EN_SONARCLOUD
            -Dsonar.projectKey=MI_PROJECT_KEY_EN_SONARCLOUD
            -Dsonar.host.url=https://sonarcloud.io

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
