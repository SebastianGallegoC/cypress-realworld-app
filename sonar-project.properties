# === SonarCloud basic configuration ===
# Cambiar estos valores por los reales de mi organización y proyecto en SonarCloud
sonar.organization=MI_ORG_EN_SONARCLOUD
sonar.projectKey=MI_PROJECT_KEY_EN_SONARCLOUD
sonar.host.url=https://sonarcloud.io

# Rutas de código fuente a analizar (ajusta si es necesario)
sonar.sources=src,backend
sonar.tests=cypress,src,backend

# Excluir archivos de configuración y node_modules
sonar.exclusions=node_modules/**,**/*.config.js,**/*.config.ts

# Opcional: exclusiones de tests si hace falta
# sonar.test.exclusions=**/*.spec.ts,**/*.test.ts
